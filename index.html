<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ServiceComms - IASD Araruama</title>
  <script src="https://unpkg.com"></script>
  <style>
    :root { --bg: #0f1117; --card: #181c26; --card-alt: #212736; --primary: #3b82f6; --cyan: #06b6d4; --danger: #ef4444; --success: #10b981; --warning: #f59e0b; --text: #f3f4f6; --muted: #9ca3af; --border: #2a3142; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #login-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 400px; margin: 0 auto; width: 100%; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 28px 24px; display: flex; flex-direction: column; gap: 18px; }
    .app-brand { display: flex; align-items: center; gap: 12px; }
    .app-logo { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), var(--cyan)); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .app-brand h1 { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .app-brand p { font-size: 0.78rem; color: var(--cyan); }
    label { font-size: 0.75rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; display: block; }
    input, select { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: #fff; font-size: 0.95rem; outline: none; }
    .btn-login { background: linear-gradient(135deg, var(--primary), var(--cyan)); color: #fff; border: none; padding: 15px; border-radius: 14px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    #app-screen { display: none; flex: 1; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; width: 100%; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    header { padding: 14px 18px; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    header h2 { font-size: 1.05rem; font-weight: 700; }
    header span { font-size: 0.75rem; color: var(--muted); }
    .live-pill { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .tab-view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .tab-view.active { display: flex; }
    .radio-scroll { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
    .status-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; text-align: center; font-size: 0.85rem; color: var(--muted); }
    .status-card.active-voice { background: rgba(6, 182, 212, 0.15); border-color: var(--cyan); color: #67e8f9; font-weight: 700; }
    .ptt-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 8px 0; }
    .ptt-outer { width: 196px; height: 196px; border-radius: 50%; background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.25); display: flex; align-items: center; justify-content: center; }
    .ptt-outer.talking { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); box-shadow: 0 0 35px rgba(239, 68, 68, 0.4); }
    #ptt-btn { width: 162px; height: 162px; border-radius: 50%; background: linear-gradient(145deg, var(--primary), #1d4ed8); border: 4px solid #1e3a8a; color: #fff; font-weight: 800; font-size: 0.9rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    #ptt-btn.talking { background: linear-gradient(145deg, var(--danger), #b91c1c); border-color: #7f1d1d; transform: scale(0.95); }
    .section-hdr { font-size: 0.75rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .team-list { display: flex; flex-direction: column; gap: 6px; }
    .team-row { background: var(--card); border: 1px solid var(--border); padding: 10px 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .dot-on { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 8px; }
    .alerts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .alert-tile { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; }
    .alert-tile:active { background: var(--warning); color: #000; border-color: var(--warning); }
    .chat-list { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 0.88rem; line-height: 1.4; }
    .bubble.me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .bubble.them { align-self: flex-start; background: var(--card-alt); color: var(--text); border-bottom-left-radius: 4px; }
    .bubble.alert { align-self: center; max-width: 95%; background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); color: #fcd34d; font-weight: 700; text-align: center; font-size: 0.82rem; }
    .bubble.sys { align-self: center; font-size: 0.74rem; color: var(--muted); }
    .b-sender { font-size: 0.7rem; font-weight: 700; color: var(--cyan); display: block; margin-bottom: 2px; }
    .b-time { font-size: 0.65rem; opacity: 0.7; margin-left: 6px; }
    .chat-composer { padding: 10px 14px; background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .chat-composer input { border-radius: 20px; padding: 10px 16px; }
    .btn-send { background: var(--primary); color: #fff; border: none; border-radius: 20px; padding: 0 18px; font-weight: 700; cursor: pointer; }
    .pad-scroll { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; font-size: 0.85rem; }
    th { background: var(--card-alt); color: var(--cyan); text-align: left; padding: 12px 10px; font-size: 0.76rem; }
    td { padding: 11px 10px; border-bottom: 1px solid var(--border); }
    .ch-num { font-weight: 800; color: var(--warning); width: 55px; }
    .chk-card { background: var(--card); border: 1px solid var(--border); padding: 14px; border-radius: 14px; display: flex; align-items: center; gap: 12px; font-size: 0.88rem; cursor: pointer; }
    .chk-card input { width: 18px; height: 18px; accent-color: var(--success); }
    .chk-card.done { opacity: 0.45; text-decoration: line-through; }
    nav { background: var(--card); border-top: 1px solid var(--border); height: 64px; display: flex; }
    .nav-btn { flex: 1; background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 600; gap: 4px; cursor: pointer; position: relative; }
    .nav-btn.active { color: var(--primary); }
    .nav-btn span.ico { font-size: 1.25rem; }
    .badge-new { position: absolute; top: 8px; right: 26%; background: var(--danger); color: #fff; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 10px; display: none; }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-card">
      <div class="app-brand">
        <div class="app-logo">🎙️</div>
        <div>
          <h1>ServiceComms</h1>
          <p>IASD Araruama • Equipe de Som</p>
        </div>
      </div>
      <div>
        <label>Sua Posição</label>
        <select id="role-select">
          <option value="Mesa de Som">🎛️ Mesa de Som</option>
          <option value="Palco / Retorno">🎤 Palco / Retorno</option>
          <option value="Transmissão / Câmera">📹 Transmissão / Câmera</option>
          <option value="Projeção / Letras">💻 Projeção / Letras</option>
          <option value="Pastor / Direção">🙏 Pastor / Direção</option>
        </select>
      </div>
      <div>
        <label>Canal da Igreja</label>
        <input type="text" id="room-input" value="iasd-araruama-som">
      </div>
      <button class="btn-login" onclick="entrar()">Entrar no App</button>
    </div>
  </div>
  <div id="app-screen">
    <header>
      <div>
        <h2>ServiceComms</h2>
        <span id="role-subtitle">Mesa de Som</span>
      </div>
      <div class="live-pill" id="online-count">● 1 Online</div>
    </header>
    <div id="view-radio" class="tab-view active">
      <div class="radio-scroll">
        <div class="status-card" id="radio-banner">Canal livre — Segure o botão para transmitir</div>
        <div class="ptt-wrapper">
          <div class="ptt-outer" id="ptt-ring">
            <button id="ptt-btn"><span style="font-size:1.8rem">🎙️</span><span>SEGURE PARA<br>FALAR</span></button>
          </div>
        </div>
        <div>
          <div class="section-hdr">Alertas Rápidos</div>
          <div class="alerts-grid">
            <button class="alert-tile" onclick="mandarAlerta('🔊 Mais retorno')">🔊 Mais Retorno</button>
            <button class="alert-tile" onclick="mandarAlerta('🎤 Problema no Mic')">🎤 Problema Mic</button>
